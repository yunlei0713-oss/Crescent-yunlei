appId: com.crescent.app
productName: 墨巡
directories:
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - resources/**/*
  - package.json
  - '!out/implementation/**/*'
  - '!experiments/**/*'
  - '!**/.vscode/*'
  - '!Document/**/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@tailwindcss/**/*'
  # Renderer has its own lazy PDF chunk; Main lazily imports the legacy text reader.
  - '!node_modules/pdfjs-dist/{web,build,image_decoders,types,wasm}/**/*'
  - '!node_modules/pdfjs-dist/legacy/web/**/*'
  - '!node_modules/pdfjs-dist/**/*.map'
  - '!node_modules/@napi-rs/canvas*/**/*'
  # Prefer node-pty N-API prebuilds over host-compiled build/ binaries.
  - '!node_modules/node-pty/build/**'
  - '!design/**/*'
  - '!build/icons/preview/**/*'
asarUnpack:
  - resources/**
  # node-pty loads native binaries from prebuilds/<platform>-<arch> at runtime.
  - '**/node-pty/prebuilds/**'
  # Pi is ESM-only and loaded via dynamic import(); keep it outside asar.
  - '**/@earendil-works/**'
  # MCP SDK is ESM-first and loaded via dynamic import().
  - '**/@modelcontextprotocol/**'
  # Pi optional image tooling (WASM) must be readable outside asar.
  - '**/@silvia-odwyer/photon-node/**'
  # Native ESM import and PDF.js's local worker must resolve outside the archive.
  - '**/pdfjs-dist/legacy/build/**'
  - '**/pdfjs-dist/{standard_fonts,cmaps}/**'
win:
  executableName: crescent
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: moxun-${version}-${arch}-mac.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64]
    - target: zip
      arch: [x64]
  extendInfo:
    - NSAppleEventsUsageDescription: 墨巡需要连接您选择的 iTerm 会话，以同步终端内容并转发您的输入。
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: moxun-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
# node-pty ships N-API prebuilds for darwin/win32/linux. Do not force node-gyp rebuild
# during packaging — that breaks cross-compiling Windows/Linux targets from macOS.
npmRebuild: false
afterPack: ./scripts/prepare-macos-native.cjs
publish:
  provider: github
  owner: aide-family
  repo: Crescent
