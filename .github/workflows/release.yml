name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

  quality:
    name: Release quality gate
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release source
        run: npm run ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel (x64)
            os: macos-latest
            artifact_name: moxun-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use *_RAW aliases so empty GitHub secrets do not become CSC_LINK="" —
          # electron-builder treats an empty CSC_LINK as a cert path and fails with
          # "<repo-root> not a file".
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_RAW: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_RAW: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_RAW: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          promote_secret() {
            local raw_name="$1"
            local dest_name="$2"
            local value="${!raw_name-}"
            if [[ -n "${value}" ]]; then
              export "${dest_name}=${value}"
            else
              unset "${dest_name}" || true
            fi
          }

          # Ensure signing vars start unset; only promote non-empty secrets.
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER || true
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true

          promote_secret CSC_LINK_RAW CSC_LINK
          promote_secret CSC_KEY_PASSWORD_RAW CSC_KEY_PASSWORD
          promote_secret APPLE_API_KEY_RAW APPLE_API_KEY
          promote_secret APPLE_API_KEY_ID_RAW APPLE_API_KEY_ID
          promote_secret APPLE_API_ISSUER_RAW APPLE_API_ISSUER
          promote_secret APPLE_ID_RAW APPLE_ID
          promote_secret APPLE_APP_SPECIFIC_PASSWORD_RAW APPLE_APP_SPECIFIC_PASSWORD
          promote_secret APPLE_TEAM_ID_RAW APPLE_TEAM_ID

          npm run build

          MAC_SIGN=0
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]]; then
            MAC_SIGN=1
          fi
          if [[ "$MAC_SIGN" == "1" ]]; then
            unset CSC_IDENTITY_AUTO_DISCOVERY || true
            npx electron-builder --mac --x64 --publish=never
          else
            # Keep CSC_LINK truly unset for unsigned builds.
            unset CSC_LINK CSC_KEY_PASSWORD || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --x64 \
              -c.mac.identity=null -c.mac.notarize=false -c.mac.hardenedRuntime=false --publish=never
          fi

      - name: Packaging smoke check
        shell: bash
        run: node scripts/smoke-packaging.cjs dist

      - name: Upload build assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/moxun-*-x64.dmg
            dist/moxun-*-x64-mac.zip
            dist/*.blockmap
            dist/*.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Packaging smoke check (release assets)
        run: node scripts/smoke-packaging.cjs release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt

      - name: Render release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{DATE}}/$(date -u +%Y-%m-%d)/g" \
            -e "s#{{REPOSITORY}}#${GITHUB_REPOSITORY}#g" \
            .github/release-template.md > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 墨巡 MoXun ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
